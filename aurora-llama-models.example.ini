; llama-server Router-Preset (OpenAI-kompatibles Backend für Aurora)
; Modelle/Sektionen werden als Modell-IDs in /v1/models gemeldet — der
; Sektionsname MUSS dem Modellnamen entsprechen, den Aurora nutzt
; (Registry-Default + letzte Auswahl), sonst findet der Router das Modell nicht.
;
; Parameter je Sektion = llama-server-Argumente ohne führende Doppelpunkte.
; Siehe auch: tools/server/README.md (llama.cpp) "Model presets".
version = 1

; Globale Settings für ALLE Modelle (werden von Modell-seitigen Keys überlagert):
; 8192 Kontext (bisheriges -c), alle Layer auf die GPU (iGPU: geteilter Speicher,
; GPU rechnet pro Watt effizienter als CPU). Host/Port werden vom Router
; verwaltet (in der Unit gesetzt) und hier NICHT überschreiben.
[*]
c = 8192
n-gpu-layers = 99

;Bonsai 27B ternär (group-64, läuft NUR im upstream llama.cpp)
[bonsai-27b-ternary]
model = <HOME>/.local/share/aurora/models/Ternary-Bonsai-27B-Q2_g64.gguf
load-on-startup = true
; Nach einem Unload wartet der Router 10 s auf laufende Requests, dann kappt er.
stop-timeout = 10